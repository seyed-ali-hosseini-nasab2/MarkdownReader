name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine qtwebchannel'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Package Windows Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/MarkdownReader-windows-x64 -Force
          Copy-Item -Path build/Release/* -Destination dist/MarkdownReader-windows-x64/ -Recurse
          Compress-Archive -Path dist/MarkdownReader-windows-x64/* -DestinationPath dist/MarkdownReader-windows-x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownReader-windows-x64
          path: dist/MarkdownReader-windows-x64.zip

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-webengine-dev qt6-webchannel-dev \
            libgl1-mesa-dev

      - name: Configure CMake
        run: |
          cmake -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build-linux

      - name: Package Linux Release
        run: |
          mkdir -p dist/MarkdownReader-linux-x86_64
          cp build-linux/MarkdownReader dist/MarkdownReader-linux-x86_64/
          cp sample.md dist/MarkdownReader-linux-x86_64/
          tar -czvf dist/MarkdownReader-linux-x86_64.tar.gz -C dist/MarkdownReader-linux-x86_64 .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownReader-linux-x86_64
          path: dist/MarkdownReader-linux-x86_64.tar.gz

  create-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: MarkdownReader-windows-x64
          path: release-assets/

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: MarkdownReader-linux-x86_64
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/MarkdownReader-windows-x64.zip
            release-assets/MarkdownReader-linux-x86_64.tar.gz
          generate_release_notes: true
