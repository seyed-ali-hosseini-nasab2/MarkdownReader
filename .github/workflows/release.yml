name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine qtwebchannel qtpositioning'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_DIR }}"

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Package Windows Release
        shell: pwsh
        run: |
          $TAG = if ("${{ github.ref_name }}" -match "^v") { "${{ github.ref_name }}" } else { "v1.2.0" }
          $ARCHIVE_NAME = "MarkdownReader-$TAG-windows-x64"
          New-Item -ItemType Directory -Path "dist/$ARCHIVE_NAME" -Force
          Copy-Item -Path build/Release/* -Destination "dist/$ARCHIVE_NAME/" -Recurse
          Copy-Item -Path sample.md, README.md, README_fa.md, LICENSE -Destination "dist/$ARCHIVE_NAME/"
          Compress-Archive -Path "dist/$ARCHIVE_NAME/*" -DestinationPath "dist/$ARCHIVE_NAME.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*.zip

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-webengine-dev qt6-webchannel-dev \
            libgl1-mesa-dev

      - name: Configure CMake
        run: |
          cmake -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build-linux

      - name: Package Linux Release
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v ]]; then TAG="v1.2.0"; fi
          ARCHIVE_NAME="MarkdownReader-$TAG-linux-x86_64"
          mkdir -p "dist/$ARCHIVE_NAME"
          cp build-linux/MarkdownReader "dist/$ARCHIVE_NAME/"
          cp sample.md README.md README_fa.md LICENSE "dist/$ARCHIVE_NAME/"
          tar -czvf "dist/$ARCHIVE_NAME.tar.gz" -C "dist/$ARCHIVE_NAME" .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*.tar.gz

  create-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
          generate_release_notes: true
